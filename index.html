<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Squad Randomizer</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-cache">
    <link rel="icon" href="static/images/ApexIcon.png">
    <script>
        // Cache busting: append a unique query string to JS/CSS so the browser
        // always fetches the latest version after a release (no file renaming needed).
        window.ASSET_VER = Date.now();
        document.write('<link rel="stylesheet" href="static/css/style.css?v=' + ASSET_VER + '">');
    </script>
</head>
<body>

<div class="container">
    <!-- Top bar: players, no-repeat settings, Discord webhook -->
    <div class="settings-bar">
        <div id="player-toggles" class="player-toggles"></div>

        <div class="setting-group"
             title="How many legends always stay in the pool. With N selected legends you get N - reserve different legends in a row.">
            <label for="history-reserve">Reserve</label>
            <input type="number" id="history-reserve" min="0" max="50">
            <button type="button" id="reset-history" class="reset-btn" title="Reset roll history">↺</button>
        </div>

        <input type="text" id="webhook-url" placeholder="Discord Webhook URL" autocomplete="off">
    </div>

    <!-- Rolled squad -->
    <div id="result" class="result-zone">
        <div class="placeholder-text">READY UP?</div>
    </div>

    <div class="btn-group">
        <button type="button" id="roll-btn" class="roll-btn">RANDOMIZE</button>
        <button type="button" id="discord-btn" class="discord-btn" hidden>SEND TO DISCORD</button>
    </div>

    <!-- Per-player legend pools -->
    <div id="players-container" class="players-row"></div>
</div>

<script>document.write('<script src="static/js/app.js?v=' + ASSET_VER + '"><\/script>');</script>

</body>
</html>
