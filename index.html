<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Squad Randomizer</title>
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<div class="container">
    <div class="settings-bar">
        <div class="player-toggle-group">
            <input type="checkbox" id="active-p1" checked onchange="togglePlayer('p1')">
            <input type="text" id="name-p1" placeholder="P1" oninput="updateNames()">
        </div>
        <div class="player-toggle-group">
            <input type="checkbox" id="active-p2" checked onchange="togglePlayer('p2')">
            <input type="text" id="name-p2" placeholder="P2" oninput="updateNames()">
        </div>
        <div class="player-toggle-group">
            <input type="checkbox" id="active-p3" checked onchange="togglePlayer('p3')">
            <input type="text" id="name-p3" placeholder="P3" oninput="updateNames()">
        </div>
        <input type="text" id="webhook-url" placeholder="Discord Webhook URL" oninput="saveWebhook()">
    </div>

    <div id="result" class="result-zone">
        <div class="placeholder-text">READY UP?</div>
    </div>

    <div class="btn-group">
        <button id="rollBtn" class="roll-btn" onclick="startRoulette()">RANDOMIZE</button>
        <button id="discordBtn" class="discord-btn" onclick="sendToDiscord()">SEND TO DISCORD</button>
    </div>

    <div id="players-container" class="players-row"></div>
</div>

<script src="static/js/11f9fe8.js"></script>

</body>
</html>
