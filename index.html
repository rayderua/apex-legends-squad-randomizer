<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Squad Randomizer</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="theme-color" content="#0b0d12">
    <link rel="icon" href="static/images/ApexIcon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <script>
        // Cache busting: append a unique query string to JS/CSS so the browser
        // always fetches the latest version after a release (no file renaming needed).
        window.ASSET_VER = Date.now();
        document.write('<link rel="stylesheet" href="static/css/style.css?v=' + ASSET_VER + '">');
    </script>
</head>
<body>

<!-- The whole UI is rendered by static/js/app.js -->
<div id="app"></div>

<script>document.write('<script src="static/js/app.js?v=' + ASSET_VER + '"><\/script>');</script>

</body>
</html>
