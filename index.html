    <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Squad Randomizer</title>
    <meta name="referrer" content="no-referrer">
    <style>
        :root {
            --apex-red: #ff4b4b;
            --bg: #0d0d0d;
            --card-bg: #1a1a1a;
            --accent-blue: #00d4ff;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 2px 2px #000;
        }

        /* Зона результата */
        .result-zone {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            margin-bottom: 40px;
            padding: 20px;
            background: radial-gradient(circle, #222 0%, #000 100%);
            border: 2px solid var(--apex-red);
            border-radius: 15px;
            min-height: 250px;
            box-shadow: 0 0 20px rgba(255, 75, 75, 0.2);
        }

        .res-item {
            text-align: center;
            width: 180px;
            animation: spawn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes spawn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .res-item img {
            width: 100%;
            border-bottom: 4px solid var(--apex-red);
            filter: drop-shadow(0 0 10px rgba(255, 75, 75, 0.4));
        }

        .res-name {
            background: var(--apex-red);
            padding: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Сетка игроков */
        .players-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .player-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border-top: 5px solid #333;
        }

        .player-name {
            margin: 0 0 15px 0;
            color: var(--accent-blue);
            font-size: 1.2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        /* Группировка по ролям */
        .class-group {
            margin-bottom: 15px;
        }

        .class-header {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .class-icon {
            color: var(--apex-red);
            font-size: 14px;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
            gap: 6px;
        }

        /* Чекбоксы легенд */
        .legend-opt {
            position: relative;
            cursor: pointer;
            aspect-ratio: 1/1;
            background: #000;
            border: 1px solid #333;
            transition: 0.2s;
        }

        .legend-opt img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) brightness(0.4);
            transition: 0.2s;
        }

        .legend-opt input {
            display: none;
        }

        .legend-opt:hover img {
            filter: grayscale(0.5) brightness(0.8);
        }

        .legend-opt:has(input:checked) {
            border-color: var(--apex-red);
            transform: scale(1.05);
            z-index: 2;
        }

        .legend-opt:has(input:checked) img {
            filter: grayscale(0) brightness(1);
        }

        /* Кнопка */
        .roll-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            background: var(--apex-red);
            color: white;
            font-size: 22px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
            transition: 0.2s;
        }

        .roll-btn:hover {
            background: #ff2222;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 75, 75, 0.4);
        }

        .placeholder-text {
            color: #444;
            font-size: 1.5rem;
            align-self: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Squad Randomizer</h1>

    <div id="result" class="result-zone">
        <div class="placeholder-text">WAITING FOR SQUAD...</div>
    </div>

    <div id="players-container" class="players-row"></div>

    <button class="roll-btn" onclick="generateSquad()">READY UP</button>
</div>

<script>
    const CONFIG = {
        players: [
            { id: "p1", name: "Player 1", legends: [] },
            { id: "p2", name: "Player 2", legends: [] },
            { id: "p3", name: "Player 3", legends: [] }
        ],
        classes: {
            "Assault": ["Bangalore", "Ash", "Fuse", "Mad Maggie", "Ballistic"],
            "Skirmisher": ["Wraith", "Octane", "Pathfinder", "Horizon", "Valkyrie", "Revenant", "Alter"],
            "Recon": ["Bloodhound", "Crypto", "Seer", "Vantage"],
            "Support": ["Lifeline", "Loba", "Gibraltar", "Newcastle", "Conduit", "Mirage"],
            "Controller": ["Caustic", "Wattson", "Rampart", "Catalyst"]
        },
        classIcons: {
            "Assault": "⚡",
            "Skirmisher": "🚀",
            "Recon": "👁",
            "Support": "✚",
            "Controller": "⭖"
        }
    };


    const container = document.getElementById('players-container');

    CONFIG.players.forEach(player => {
        let playerHtml = `<div class="player-card"><h2 class="player-name">${player.name}</h2>`;

        for (const [className, members] of Object.entries(CONFIG.classes)) {
            playerHtml += `
                <div class="class-group">
                    <div class="class-header">
                        <span class="class-icon">${CONFIG.classIcons[className]}</span> ${className}
                    </div>
                    <div class="legend-grid">`;

            members.forEach(name => {

                const isChecked = player.legends.length === 0 || player.legends.includes(name);
                fileName = name.replace(/ /g, "_");
                playerHtml += `
                    <label class="legend-opt">
                        <input type="checkbox" name="${player.id}" value="${name}" ${isChecked ? 'checked' : ''}>
                        <img src="static/legends/Portrait_${fileName}_square.png" title="${name}">
                    </label>`;
            });

            playerHtml += `</div></div>`;
        }
        playerHtml += `</div>`;
        container.innerHTML += playerHtml;
    });

    function generateSquad() {
        const resultZone = document.getElementById('result');

        // Получаем списки выбранных героев для каждого игрока
        const pools = CONFIG.players.map(p => {
            return Array.from(document.querySelectorAll(`input[name="${p.id}"]:checked`)).map(i => i.value);
        });

        // Валидация
        if (pools.some(p => p.length === 0)) {
            alert("У каждого игрока должен быть выбран хотя бы один герой!");
            return;
        }

        let squad = null;
        // 500 попыток найти уникальную комбинацию
        for (let i = 0; i < 500; i++) {
            let attempt = pools.map(p => p[Math.floor(Math.random() * p.length)]);
            if (new Set(attempt).size === 3) {
                squad = attempt;
                break;
            }
        }

        if (squad) {
            resultZone.innerHTML = squad.map(name => `
                <div class="res-item">
                    <img src="static/legends/Portrait_${name}_square.png" onerror="this.src='https://via.placeholder.com/150/222/888?text=${name}'">
                    <div class="res-name">${name}</div>
                </div>
            `).join('');
        } else {
            alert("Не удалось собрать уникальный отряд! Увеличьте пул героев у игроков.");
        }
    }
</script>

</body>
</html>
