<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Squad Randomizer</title>
    <meta name="referrer" content="no-referrer">
    <style>
        :root {
            --apex-red: #ff4b4b;
            --bg: #0d0d0d;
            --card-bg: #161616;
            --accent-blue: #00d4ff;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 13px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin: 10px 0;
        }

        .result-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background: #000;
            border: 2px solid var(--apex-red);
            border-radius: 8px;
            min-height: 120px;
        }

        .res-item {
            text-align: center;
            width: 90px;
            transition: transform 0.2s;
        }

        .res-item img {
            width: 100%;
            border-bottom: 3px solid var(--apex-red);
            display: block;
        }

        .res-name {
            background: var(--apex-red);
            padding: 2px;
            font-weight: bold;
            font-size: 11px;
        }

        .players-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .player-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 6px;
            border-top: 3px solid #333;
        }

        .player-name {
            margin: 0 0 10px 0;
            color: var(--accent-blue);
            font-size: 1rem;
            text-align: center;
        }

        .class-group {
            margin-bottom: 8px;
        }

        .class-header {
            font-size: 9px;
            color: #777;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }


        .legend-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
        }

        .legend-opt {
            position: relative;
            cursor: pointer;
            aspect-ratio: 1/1;
            background: #222;
            border: 1px solid #333;
        }

        .legend-opt img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) brightness(0.3);
        }

        .legend-opt input { display: none; }

        .legend-opt:has(input:checked) {
            border-color: var(--apex-red);
            z-index: 1;
        }

        .legend-opt:has(input:checked) img {
            filter: grayscale(0) brightness(1);
        }

        .roll-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            padding: 15px;
            background: var(--apex-red);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
        }

        .roll-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .placeholder-text { color: #333; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>SQUAD RANDOMIZER</h1>

    <div id="result" class="result-zone">
        <div class="placeholder-text">READY UP?</div>
    </div>
    <button id="rollBtn" class="roll-btn" onclick="startRoulette()">READY UP</button>
    <div id="players-container" class="players-row"></div>


</div>

<script>
    const CONFIG = {
        players: [
            { id: "p1", name: "Player 1", legends: [] },
            { id: "p2", name: "Player 2", legends: [] },
            { id: "p3", name: "Player 3", legends: [] }
        ],
        classes: {
            "Assault": ["Bangalore", "Ash", "Fuse", "Mad Maggie", "Ballistic"],
            "Skirmisher": ["Wraith", "Octane", "Pathfinder", "Horizon", "Valkyrie", "Revenant", "Alter"],
            "Recon": ["Bloodhound", "Crypto", "Seer", "Vantage"],
            "Support": ["Lifeline", "Loba", "Gibraltar", "Newcastle", "Conduit", "Mirage"],
            "Controller": ["Caustic", "Wattson", "Rampart", "Catalyst"]
        },
        classIcons: { "Assault": "⚡", "Skirmisher": "🚀", "Recon": "👁", "Support": "✚", "Controller": "⭖" }
    };

    function getLegendImg(name) {
        fileName = name.replace(/ /g, "_");
        return encodeURI(`static/legends/Portrait_${fileName}_square.png`);
    }

    // Рендер интерфейса
    const container = document.getElementById('players-container');
    CONFIG.players.forEach(player => {
        let playerHtml = `<div class="player-card"><h2 class="player-name">${player.name}</h2>`;
        for (const [className, members] of Object.entries(CONFIG.classes)) {
            playerHtml += `<div class="class-group">
                <div class="class-header"><span>${CONFIG.classIcons[className]}</span> ${className}</div>
                <div class="legend-grid">`;
            members.forEach(name => {
                const isChecked = player.legends.length === 0 || player.legends.includes(name);
                playerHtml += `
                    <label class="legend-opt">
                        <input type="checkbox" name="${player.id}" value="${name}" ${isChecked ? 'checked' : ''}>
                        <img src="${getLegendImg(name)}" title="${name}" onerror="this.src='https://via.placeholder.com/40/222/555?text=${name[0]}'">
                    </label>`;
            });
            playerHtml += `</div></div>`;
        }
        playerHtml += `</div>`;
        container.innerHTML += playerHtml;
    });

    async function startRoulette() {
        const btn = document.getElementById('rollBtn');
        const resultZone = document.getElementById('result');

        const pools = CONFIG.players.map(p =>
            Array.from(document.querySelectorAll(`input[name="${p.id}"]:checked`)).map(i => i.value)
        );

        if (pools.some(p => p.length === 0)) {
            alert("Выбери хотя бы по одной легенде!");
            return;
        }

        btn.disabled = true;

        let finalSquad = null;
        for (let j = 0; j < 500; j++) {
            let attempt = pools.map(p => p[Math.floor(Math.random() * p.length)]);
            if (new Set(attempt).size === 3) {
                finalSquad = attempt;
                break;
            }
        }

        if (finalSquad) {
            updateResultUI(finalSquad, 1);
        } else {
            alert("Не удалось найти 3 разных героя!");
        }

        btn.disabled = false;
    }

    function updateResultUI(squad, opacity) {
        const resultZone = document.getElementById('result');
        resultZone.innerHTML = squad.map(name => `
            <div class="res-item" style="opacity: ${opacity}">
                <img src="${getLegendImg(name)}">
                <div class="res-name">${name}</div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
